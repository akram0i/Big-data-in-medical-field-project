<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1072" viewBox="0 0 960 1072"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="480" y="30.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2b2b2b" font-weight="bold" font-style="normal">Data tasks: claims CSV (Oracle billing)</text><path d="M150.0,59.0 V97.0 A150.0,9 0 0 0 450.0,97.0 V59.0 A150.0,9 0 0 0 150.0,59.0 Z" fill="#e8f1fa" stroke="#1f5f9e" stroke-width="2"/><path d="M150.0,59.0 A150.0,9 0 0 0 450.0,59.0" fill="none" stroke="#1f5f9e" stroke-width="2"/><text x="300" y="78.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f5f9e" font-weight="bold" font-style="normal">raw_claims_csv</text><text x="300" y="97.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1f5f9e" font-weight="bold" font-style="normal">quoted CSV, one file</text><path d="M300,106 L300,150.0" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#a)"/><rect x="140.0" y="150.0" width="320" height="52" rx="12" fill="#e8f1fa" stroke="#1f5f9e" stroke-width="2"/><text x="300" y="181.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2b2b2b" font-weight="normal" font-style="normal">Read quoted CSV</text><text x="480" y="180.9" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b6b6b" font-weight="normal" font-style="normal">OpenCSVSerde keeps commas in amounts</text><path d="M300,202.0 L300,254.0" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#a)"/><rect x="140.0" y="254.0" width="320" height="52" rx="12" fill="#e8f1fa" stroke="#1f5f9e" stroke-width="2"/><text x="300" y="285.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2b2b2b" font-weight="normal" font-style="normal">Clean amounts</text><text x="480" y="284.9" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b6b6b" font-weight="normal" font-style="normal">'AED 1,234.50' to DECIMAL; blank = NULL</text><path d="M300,306.0 L300,358.0" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#a)"/><rect x="140.0" y="358.0" width="320" height="52" rx="12" fill="#e8f1fa" stroke="#1f5f9e" stroke-width="2"/><text x="300" y="389.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2b2b2b" font-weight="normal" font-style="normal">Convert dates</text><text x="480" y="388.9" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b6b6b" font-weight="normal" font-style="normal">submitted date to DATE</text><path d="M300,410.0 L300,462.0" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#a)"/><rect x="140.0" y="462.0" width="320" height="52" rx="12" fill="#e8f1fa" stroke="#1f5f9e" stroke-width="2"/><text x="300" y="493.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2b2b2b" font-weight="normal" font-style="normal">Normalise diagnosis code</text><text x="480" y="492.9" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b6b6b" font-weight="normal" font-style="normal">upper-case, add dot; flag valid or not</text><path d="M300,514.0 L300,566.0" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#a)"/><rect x="140.0" y="566.0" width="320" height="52" rx="12" fill="#e8f1fa" stroke="#1f5f9e" stroke-width="2"/><text x="300" y="597.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2b2b2b" font-weight="normal" font-style="normal">Validate</text><text x="480" y="596.9" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b6b6b" font-weight="normal" font-style="normal">missing 